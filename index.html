
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TsukiToKokoro</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="app.js"></script>
</head>
<body>
  <header>
    <h1>TsukiToKokoro</h1>
    <p>Anime x Life Realism | Aesthetic Planner & Reflection Hub</p>
  </header>

  <main>
    <section id="calendar-section">
      <h2>Content Calendar</h2>
      <div id="calendar"></div>
    </section>

    <section id="dashboard-section">
      <h2>Dashboard Blocks</h2>
      <div id="dashboard">
        <div class="block" draggable="true">Quote of the Day</div>
        <div class="block" draggable="true">Mood Tracker</div>
        <div class="block" draggable="true">Post Idea</div>
        <div class="block" draggable="true">Instagram Stats</div>
      </div>
    </section>

    <section id="stats-section">
      <h2>Instagram Growth</h2>
      <p>Followers: <span id="followers">0</span></p>
      <p>Engagement Rate: <span id="engagement">0%</span></p>
    </section>
  </main>

  <footer>
    <p>Built with love and moonlight by TsukiToKokoro</p>
  </footer>
</body>
</html>
